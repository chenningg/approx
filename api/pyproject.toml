[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chen Ning" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "laya-client",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "sdv[excel]>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.54",
    # Pulled in by SDV (CTGAN); pinned to the CPU index below so the image
    # does not ship multi-gigabyte CUDA wheels.
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.main:app"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
laya-client = { path = "../laya/sdk/python" }
torch = { index = "pytorch-cpu" }
